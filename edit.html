<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>录入作品 - 稿仓</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo-link">
                <h1 class="logo">
                    <span class="logo-mark">稿</span>
                    稿仓
                </h1>
            </a>
            <nav class="nav">
                <a href="edit.html" class="nav-link active">录入作品</a>
                <a href="portfolio.html" class="nav-link">我的作品集</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="form-section">
                <h2>录入新作品</h2>
                <form id="workForm">
                    <div class="form-group">
                        <label for="title">作品标题 <span class="required">*</span></label>
                        <input type="text" id="title" name="title" placeholder="例如：城市边缘的搬迁者——城中村改造调查报道" required>
                    </div>

                    <div class="form-group">
                        <label for="category">作品类型 <span class="required">*</span></label>
                        <select id="category" name="category" required>
                            <option value="">请选择类型</option>
                            <option value="text">文字报道</option>
                            <option value="data">数据新闻</option>
                            <option value="photo">摄影组图</option>
                            <option value="video">视频作品</option>
                            <option value="h5">H5 / 交互页面</option>
                            <option value="poster">海报设计</option>
                            <option value="tweet">推文制作</option>
                            <option value="comment">新闻评论</option>
                            <option value="other">其他（自由填写）</option>
                        </select>
                    </div>

                    <div class="form-group" id="customCategoryGroup" style="display:none;">
                        <label for="customCategory">自定义类型 <span class="required">*</span></label>
                        <input type="text" id="customCategory" name="customCategory" placeholder="例如：播客节目、数据报告、策展方案……">
                    </div>

                    <div class="form-group">
                        <label for="link">作品链接（可选）</label>
                        <input type="url" id="link" name="link" placeholder="https://...（微信公众号、B站、腾讯文档等链接）">
                        <small class="hint">如果作品已发布在网上，可以粘贴链接</small>
                    </div>

                    <div class="form-group">
                        <label>上传本地文件（可选）</label>
                        <div class="file-upload-area" id="dropZone">
                            <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.mp4,.mov,.avi">
                            <div class="file-upload-text">
                                <div class="file-icon">
                                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                </div>
                                <p>点击选择文件，或拖拽文件到此处</p>
                                <small>支持图片、PDF、Word、视频等格式</small>
                            </div>
                        </div>
                        <div id="filePreview" class="file-preview" style="display:none;">
                            <div class="preview-content">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                                <span id="fileName" class="file-name"></span>
                                <span id="fileSize" class="file-size"></span>
                            </div>
                            <button type="button" id="removeFileBtn" class="btn btn-small">移除</button>
                        </div>
                        <small class="hint">图片会直接显示在作品集中，大文件建议用网盘链接</small>
                    </div>

                    <div class="form-group">
                        <label for="cover">封面图 URL（可选）</label>
                        <input type="url" id="cover" name="cover" placeholder="https://...（网络图片链接）">
                        <small class="hint">如果上传了图片文件，会自动用它作为封面</small>
                    </div>

                    <div class="form-group">
                        <label for="description">作品简介 <span class="required">*</span></label>
                        <textarea id="description" name="description" rows="4" placeholder="简要介绍这件作品的内容、选题背景、你的分工与亮点..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="date">完成时间</label>
                        <input type="month" id="date" name="date">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存作品</button>
                        <button type="button" id="aiBtn" class="btn btn-ai">AI 生成简介</button>
                        <a href="portfolio.html" class="btn btn-secondary">查看作品集</a>
                    </div>
                </form>

                <div id="aiResult" class="ai-result" style="display:none;">
                    <h4>AI 生成的简介参考</h4>
                    <p id="aiText"></p>
                    <button type="button" id="useAiBtn" class="btn btn-small">采用这段简介</button>
                </div>
            </section>

            <section class="list-section">
                <h2>已录入作品（<span id="count">0</span> 件）</h2>
                <div id="workList" class="work-list-mini">
                    <p class="empty-tip">还没有作品，快去录入第一件吧</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>稿仓 Gaocang · 新闻学 Web 前端技术课程实践作品</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        // ========== 文件上传处理 ==========
        let currentFile = null;

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const filePreview = document.getElementById('filePreview');
        const fileNameEl = document.getElementById('fileName');
        const fileSizeEl = document.getElementById('fileSize');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const coverInput = document.getElementById('cover');
        const categorySelect = document.getElementById('category');
        const customCategoryGroup = document.getElementById('customCategoryGroup');
        const customCategoryInput = document.getElementById('customCategory');

        categorySelect.addEventListener('change', function() {
            if (this.value === 'other') {
                customCategoryGroup.style.display = 'block';
                customCategoryInput.required = true;
            } else {
                customCategoryGroup.style.display = 'none';
                customCategoryInput.required = false;
                customCategoryInput.value = '';
            }
        });

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect({ target: fileInput });
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                if (!confirm('文件超过 5MB，可能导致存储和加载缓慢。建议先上传到网盘再粘贴链接。\n\n仍要继续上传吗？')) {
                    fileInput.value = '';
                    return;
                }
            }

            currentFile = {
                name: file.name,
                size: file.size,
                type: file.type
            };

            fileNameEl.textContent = file.name;
            fileSizeEl.textContent = formatFileSize(file.size);
            filePreview.style.display = 'flex';
            dropZone.style.display = 'none';

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentFile.data = event.target.result;
                    coverInput.placeholder = '已上传图片：' + file.name + '（将作为封面）';
                };
                reader.readAsDataURL(file);
            } else {
                if (file.size > 2 * 1024 * 1024) {
                    currentFile.data = null;
                    currentFile.tooLarge = true;
                } else {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        currentFile.data = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        removeFileBtn.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            filePreview.style.display = 'none';
            dropZone.style.display = 'block';
            coverInput.placeholder = 'https://...（网络图片链接）';
        });

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ========== 表单提交 ==========
        document.getElementById('workForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const work = {
                id: typeof generateId === 'function' ? generateId() : Date.now().toString(),
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                customCategory: document.getElementById('customCategory').value.trim() || null,
                link: document.getElementById('link').value.trim(),
                cover: document.getElementById('cover').value.trim(),
                description: document.getElementById('description').value.trim(),
                date: document.getElementById('date').value
            };

            if (currentFile) {
                work.file = {
                    name: currentFile.name,
                    size: currentFile.size,
                    type: currentFile.type,
                    data: currentFile.data || null,
                    tooLarge: currentFile.tooLarge || false
                };
                if (currentFile.type.startsWith('image/') && currentFile.data && !work.cover) {
                    work.cover = currentFile.data;
                }
            }

            let works = [];
            if (typeof getWorks === 'function') {
                works = getWorks();
            } else {
                const data = localStorage.getItem('gaocang_works');
                if (data) works = JSON.parse(data);
            }
            works.unshift(work);
            localStorage.setItem('gaocang_works', JSON.stringify(works));

            if (typeof showToast === 'function') {
                showToast('作品已保存' + (currentFile ? '（含文件：' + currentFile.name + '）' : ''), 'success');
            } else {
                alert('作品已保存');
            }

            this.reset();
            currentFile = null;
            filePreview.style.display = 'none';
            dropZone.style.display = 'block';
            coverInput.placeholder = 'https://...（网络图片链接）';

            if (typeof renderMiniList === 'function') {
                renderMiniList();
            } else {
                location.reload();
            }
        });

        // ========== AI 生成简介 ==========
        document.getElementById('aiBtn').addEventListener('click', function() {
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const categoryNames = {
                'text': '深度报道',
                'data': '数据新闻',
                'photo': '摄影组图',
                'video': '视频作品',
                'h5': 'H5交互作品',
                'comment': '新闻评论'
            };

            if (!title || !category) {
                if (typeof showToast === 'function') {
                    showToast('请先填写作品标题和类型', 'error');
                } else {
                    alert('请先填写作品标题和类型，AI 才能帮你生成简介');
                }
                return;
            }

            const mockAiTexts = [
                `本作品为一则${categoryNames[category]}，围绕"${title}"展开，通过实地走访与资料收集，呈现了选题背后的深层逻辑。作品注重事实核查与多元信源引用，体现了新闻专业主义精神。`,
                `这是一篇聚焦"${title}"的${categoryNames[category]}，选题源于对社会热点议题的持续关注。作品结构清晰、论据充分，在课程答辩中获得好评，具备求职展示价值。`,
                `该${categoryNames[category]}以"${title}"为核心，结合一手资料与数据分析，揭示了现象背后的制度因素。作品训练了采访写作与逻辑论证能力。`
            ];

            const randomText = mockAiTexts[Math.floor(Math.random() * mockAiTexts.length)];
            document.getElementById('aiText').textContent = randomText;
            document.getElementById('aiResult').style.display = 'block';
        });

        document.getElementById('useAiBtn').addEventListener('click', function() {
            document.getElementById('description').value = document.getElementById('aiText').textContent;
            document.getElementById('aiResult').style.display = 'none';
        });

        if (typeof renderMiniList === 'function') {
            renderMiniList();
        }
    </script>
</body>
</html>
