<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JavaScript 基础练习</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.8;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        h2 {
            color: #2980b9;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 6px;
            margin-top: 30px;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #2980b9;
            border-radius: 4px;
            overflow-x: auto;
        }
        .result {
            background: #e8f6f3;
            padding: 12px 15px;
            border-radius: 4px;
            margin-top: 10px;
            color: #1e8449;
        }
    </style>
</head>
<body>
    <h1>JavaScript 基础知识练习</h1>

    <h2>1. 变量的定义</h2>
    <div class="result" id="r1"></div>

    <h2>2. 变量类型</h2>
    <div class="result" id="r2"></div>

    <h2>3. 表达式</h2>
    <div class="result" id="r3"></div>

    <h2>4. 流程控制</h2>
    <div class="result" id="r4"></div>

    <h2>5. 函数</h2>
    <div class="result" id="r5"></div>

    <script>
        // ====================
        // 1. 变量的定义
        // ====================
        var name = "张三";
        let age = 20;
        const pi = 3.14159;

        var msg1 = "姓名: " + name + "<br>";
        msg1 += "年龄: " + age + "<br>";
        msg1 += "圆周率: " + pi;
        document.getElementById("r1").innerHTML = msg1;
        console.log("变量定义:", name, age, pi);

        // ====================
        // 2. 变量类型
        // ====================
        var num = 100;
        var str = "Hello";
        var bool = true;
        var obj = { x: 1, y: 2 };
        var arr = [1, 2, 3];
        var und;
        var nul = null;
        var fn = function() {};

        var msg2 = "";
        msg2 += "num 的类型: " + typeof num + "<br>";
        msg2 += "str 的类型: " + typeof str + "<br>";
        msg2 += "bool 的类型: " + typeof bool + "<br>";
        msg2 += "obj 的类型: " + typeof obj + "<br>";
        msg2 += "arr 的类型: " + typeof arr + "<br>";
        msg2 += "und 的类型: " + typeof und + "<br>";
        msg2 += "nul 的类型: " + typeof nul + "<br>";
        msg2 += "fn 的类型: " + typeof fn;
        document.getElementById("r2").innerHTML = msg2;
        console.log("变量类型:", typeof num, typeof str, typeof bool, typeof obj, typeof arr, typeof und, typeof nul, typeof fn);

        // ====================
        // 3. 表达式
        // ====================
        var a = 10, b = 3;
        var sum = a + b;
        var diff = a - b;
        var prod = a * b;
        var quot = a / b;
        var rem = a % b;

        var eq1 = (a == "10");
        var eq2 = (a === "10");
        var gt = (a > b);

        var logic1 = (true && false);
        var logic2 = (true || false);
        var logic3 = !true;

        var msg3 = "";
        msg3 += "算术: " + a + "+" + b + "=" + sum + ", " + a + "-" + b + "=" + diff + ", " + a + "*" + b + "=" + prod + ", " + a + "/" + b + "=" + quot.toFixed(2) + ", " + a + "%" + b + "=" + rem + "<br>";
        msg3 += "比较: " + a + "==\"10\"=" + eq1 + ", " + a + "===\"10\"=" + eq2 + ", " + a + ">" + b + "=" + gt + "<br>";
        msg3 += "逻辑: true&&false=" + logic1 + ", true||false=" + logic2 + ", !true=" + logic3;
        document.getElementById("r3").innerHTML = msg3;
        console.log("表达式:", sum, diff, prod, quot, rem, eq1, eq2, gt, logic1, logic2, logic3);

        // ====================
        // 4. 流程控制
        // ====================
        var score = 85;
        var level = "";

        if (score >= 90) {
            level = "优秀";
        } else if (score >= 80) {
            level = "良好";
        } else if (score >= 60) {
            level = "及格";
        } else {
            level = "不及格";
        }

        var msg4 = "成绩: " + score + "，等级: " + level + "<br>";

        var factorial = 1;
        for (var i = 1; i <= 5; i++) {
            factorial = factorial * i;
        }
        msg4 += "for循环: 1到5的阶乘 = " + factorial + "<br>";

        var count = 1;
        var total = 0;
        while (count <= 5) {
            total = total + count;
            count++;
        }
        msg4 += "while循环: 1到5的累加和 = " + total;
        document.getElementById("r4").innerHTML = msg4;
        console.log("流程控制:", level, factorial, total);

        // ====================
        // 5. 函数
        // ====================
        function add(x, y) {
            return x + y;
        }

        var multiply = function(x, y) {
            return x * y;
        };

        var divide = function(x, y) {
            return x / y;
        };

        var msg5 = "";
        msg5 += "add(4, 5) = " + add(4, 5) + "<br>";
        msg5 += "multiply(3, 6) = " + multiply(3, 6) + "<br>";
        msg5 += "divide(10, 2) = " + divide(10, 2);
        document.getElementById("r5").innerHTML = msg5;
        console.log("函数:", add(4, 5), multiply(3, 6), divide(10, 2));
    </script>
</body>
</html>
